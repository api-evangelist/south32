description: South32 is a globally diversified mining and metals company headquartered in Perth, Western Australia, spun out of BHP Billiton in May 2015 and listed on the ASX (S32). It produces commodities including alumina, aluminium, copper, manganese, silver, lead and zinc. It was surfaced via the API Evangelist harvest backlog (australia-apidays-2026); no public developer program or API has been identified, and its website (south32.net) answered our crawler with an HTTP 403 bot challenge.

